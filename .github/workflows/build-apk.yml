name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install tools
        run: pip install pillow
      - name: Create Android project
        working-directory: android-app
        run: |
          npm install
          npx cap add android
          python3 patch_android.py
      - name: Build APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk フォレストウォーカー.apk
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest フォレストウォーカー.apk --title "フォレストウォーカー Android版" --notes "スマホで開いてインストールしてください。"
