<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14301f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<title>フォレストウォーカー</title>
<link rel="stylesheet" href="lib/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>

<div id="top">
  <button id="menuBtn" aria-label="メニュー">☰</button>
  <div id="title">🌲 フォレストウォーカー</div>
  <button id="searchBtn" aria-label="地番検索">🔍</button>
</div>
<div id="status"></div>
<div id="cross"></div>
<div id="hud"><div id="elev">標高 --</div><div id="scalebox"><div id="slab"></div><div id="sbar"><i></i><i></i></div></div></div>

<div id="fabs">
  <button id="northBtn" aria-label="北を上にする"><svg id="northIcon" viewBox="0 0 24 24" width="38" height="38"><path d="M12 2 L18 13 H6 Z" fill="#d61a1a"/><path d="M12 22 L6 11 H18 Z" fill="#4a3a28"/><circle cx="12" cy="12" r="1.8" fill="#fff"/></svg></button>
  <button id="tiltBtn" aria-label="2D/3D切替">2D</button>
  <button id="refreshBtn" aria-label="地図を更新"><svg viewBox="0 0 24 24" width="30" height="30"><path fill="#1a1208" d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></button>
  <button id="locBtn" aria-label="現在地">◎</button>
  <button id="memoBtn" aria-label="メモ">📍</button>
</div>

<div id="sheet" class="hidden">
  <div class="grab" id="sheetClose">×</div>
  <div id="sheetBody"></div>
</div>

<div id="sp" class="hidden">
  <div class="grab" id="spClose">×</div>
  <h3>地番を探す</h3>
  <select id="spMuni"></select>
  <input id="spInput" placeholder="大字 地番(例:中津 1947)" autocomplete="off" inputmode="text">
  <div class="note" id="spHint">大字名と地番を空白で区切って入力します。大字名だけでも探せます。</div>
  <div id="spRes"></div>
</div>

<div id="menu" class="hidden">
  <div class="grab" id="menuClose">×</div>
  <h2>フォレストウォーカー</h2>
  <h3>地図</h3>
  <div class="seg" id="baseSeg">
    <button data-b="std" class="on">標準</button>
    <button data-b="photo">航空写真</button>
    <button data-b="cs">CS立体図</button>
    <button data-b="ls">林相図</button>
  </div>
  <label class="row"><input type="checkbox" id="chkFude" checked> 筆界・地番を表示</label>
  <label class="row"><input type="checkbox" id="chkMemo" checked> メモを表示</label>
  <label class="row">筆界の色
    <select id="fudeColor"><option value="#ffe14d">黄</option><option value="#ff5a3c">赤</option><option value="#ffffff">白</option><option value="#1c5d99">青</option></select>
  </label>
  <h3>トラッキング(歩いた道すじ)</h3>
  <p class="note">「記録を始める」を押して歩くと、通った道が青い線で残ります。記録中は画面を消さないでください(消すと止まることがあります)。</p>
  <button class="wide" id="trackBtn">● 記録を始める</button>
  <div id="trackList"></div>
  <h3>施業地(境界データ)</h3>
  <p class="note">QGISで作ったKML(またはGeoJSON)を読み込むと、境界が赤い太線で表示されます。</p>
  <button class="wide" id="areaBtn">KML / GeoJSON を読み込む</button>
  <input type="file" id="areaFile" multiple hidden>
  <div id="areaList"></div>
  <h3>圏外で使う準備</h3>
  <p class="note">Wi-Fiのある場所で保存しておくと、山の中でも使えます。</p>
  <button class="wide" id="saveBase">いま見ている範囲の地図を保存</button>
  <div id="muniList"></div>
  <h3>メモ一覧(<span id="memoCount">0</span>件)</h3>
  <div id="memoList"></div>
  <button class="wide" id="exportKmz">メモ・記録をKMZで書き出す(写真つき)</button>
  <button class="wide" id="exportMemo">メモを書き出す(コピー・写真は含まれません)</button>
  <button class="wide" id="importMemo">メモを取り込む(貼り付け)</button>
  <p class="note" id="ver"></p>
</div>

<div id="dlg" class="hidden"><div class="box" id="dlgBox"></div></div>

<script src="lib/maplibre-gl.js"></script>
<script src="lib/pmtiles.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
<script src="kml.js"></script>
<script src="track.js"></script>
<script src="kmz.js"></script>
<script src="hud.js"></script>
<script src="terrain.js"></script>
<script src="license.js"></script>
</body>
</html>
